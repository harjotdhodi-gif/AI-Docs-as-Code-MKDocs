name: Docs CI/CD (HTML + PDF + DOCX)

on:
  push:
    branches: [ "main", "Branch--2" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc librsvg2-bin
          google-chrome --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate downloads page
        run: python scripts/build_downloads.py

      - name: Build site
        run: mkdocs build --clean

      - name: Export downloadable HTML files
        run: python scripts/export_html.py

      - name: Export per-page PDF files
        run: python scripts/export_pdf.py

      - name: Remove blank PDF pages
        run: python scripts/clean_pdfs.py

      - name: Export editable DOCX files
        run: python scripts/export_docx.py

      - name: Verify generated download files
        run: python scripts/verify_downloads.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
