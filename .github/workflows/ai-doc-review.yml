name: AI Documentation Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs/**/*.md"
      - "scripts/ai_review.py"
      - "requirements.txt"
      - ".github/workflows/ai-doc-review.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  ai_review:
    name: AI Documentation Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI review
        id: review
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          FAIL_ON_SEVERITY: critical
          AI_REVIEW_REPORT_ONLY: "1"
          AI_REVIEW_REPORT_PATH: ai-review-report.md
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/ai_review.py

      - name: Create fallback report
        if: always()
        shell: bash
        run: |
          if [ ! -f ai-review-report.md ]; then
            cat > ai-review-report.md <<'EOF'
          # AI Documentation Review

          **Status:** 🔴 AI Review did not produce a report.

          Check the **AI Documentation Review** workflow log for the runtime error. Do not merge until the review completes successfully.
          EOF
          fi

      - name: Publish AI report on pull request
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ai-documentation-review
          path: ai-review-report.md

      - name: Enforce AI review execution
        if: always() && steps.review.outcome == 'failure'
        run: |
          echo "AI Documentation Review failed to execute. See the pull-request report."
          exit 1
