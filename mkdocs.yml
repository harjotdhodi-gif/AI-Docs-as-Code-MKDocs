site_name: Scriptorium Lab Services Documentation
site_description: >-
  Governed technical documentation, Docs-as-Code workflows,
  AI-assisted reviews, and documentation publishing guidance.
site_author: Scriptorium Lab Services FZCO

site_url: https://harjotdhodi-gif.github.io/AI-Docs-as-Code-MKDocs/
use_directory_urls: true

exclude_docs: |
  /includes/

repo_name: harjotdhodi-gif/AI-Docs-as-Code-MKDocs
repo_url: https://github.com/harjotdhodi-gif/AI-Docs-as-Code-MKDocs
edit_uri: edit/main/docs/

copyright: >-
  <span class="sls-footer__identity">
    <img class="sls-footer__logo" src="/AI-Docs-as-Code-MKDocs/assets/logo.png" alt="Scriptorium Lab Services FZCO logo">
    <span class="sls-footer__details">
      <span class="sls-footer__copyright">Copyright &copy; 2026, SCRIPTORIUM LAB SERVICES FZCO. All Rights Reserved.</span>
      <span class="sls-footer__address"><strong>Registered Business Address:</strong><br>IFZA Business Park, Building A1, Dubai Digital Park, Dubai Silicon Oasis, Dubai, United Arab Emirates</span>
    </span>
  </span>

theme:
  name: material
  language: en
  favicon: assets/logo.png

  font:
    text: Roboto
    code: Roboto Mono

  palette:
    scheme: default
    primary: teal
    accent: amber

  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    annotation: material/plus-circle

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables

  - toc:
      permalink: true
      permalink_title: Link to this section

  - pymdownx.details

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - awesome-nav
  - meta
  - blog
  - tags

extra:
  status:
    new: Recently added
    updated: Recently updated
    deprecated: Scheduled for retirement
    review: Under editorial review

  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/harjotdhodi/
      name: Scriptorium Lab Services on LinkedIn

    - icon: fontawesome/brands/github
      link: https://github.com/harjotdhodi-gif
      name: Scriptorium Lab Services on GitHub

    - icon: material/web
      link: https://scriptoriumlab.com
      name: Scriptorium Lab Services website

    - icon: material/email
      link: mailto:contact@scriptoriumlab.com
      name: Contact Scriptorium Lab Services

extra_css:
  - stylesheets/extra.css
  - stylesheets/branch2-updates.css
  - stylesheets/branch2-search-navigation.css
  - stylesheets/single-hero-art.css
  - stylesheets/backup-branch-fixes.css

extra_javascript:
  - javascripts/home-search.js
