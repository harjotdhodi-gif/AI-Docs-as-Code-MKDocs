site_name: Scriptorium Lab Services Documentation
site_url: https://<YOUR_GH_USERNAME>.github.io/<YOUR_REPO>/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight

plugins:
  - search
  - awesome-nav
  - pdf-export:
      enabled_if_env: ENABLE_PDF_EXPORT
      # Generate a PDF per page (default)
      # combined: false

      # OR generate a single combined PDF:
      # combined: true
      # combined_output_path: pdf/combined.pdf

